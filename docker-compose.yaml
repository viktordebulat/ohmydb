services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.5
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ohmydb
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "ohmydb", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse-init:
    image: clickhouse/clickhouse-server:25.5
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
    entrypoint: >
      clickhouse-client --host clickhouse --password ohmydb
      --queries-file /seed/01_schema.sql
    restart: "no"

  # Optional persistence backend: docker compose --profile postgres up -d
  # then set storage.url: postgresql+psycopg://ohmydb:ohmydb@localhost:5432/ohmydb
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ohmydb
      POSTGRES_PASSWORD: ohmydb
      POSTGRES_DB: ohmydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmydb"]
      interval: 2s
      timeout: 2s
      retries: 30
