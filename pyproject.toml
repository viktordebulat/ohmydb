[project]
name = "ohmydb"
version = "0.1.0"
description = "Schema catalog: table schemas + interconnections, visualized and served to AI agents"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.8",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ohmydb = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
