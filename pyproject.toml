[project]
name = "ohmydb"
version = "0.1.0"
description = "Schema catalog: table schemas + interconnections, visualized and served to AI agents"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect>=1.6.0",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "fastapi>=0.139.2",
  "uvicorn[standard]>=0.51.0",
  "fastmcp>=3.4.4",
  "psycopg[binary]>=3.3.4",
  "alembic>=1.18.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
 "playwright>=1.62.0",
 "pytest>=9.1.1",
]

[project.scripts]
ohmydb = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
