[project]
name = "ohmydb"
version = "0.1.0"
description = "Schema catalog: table schemas + interconnections, visualized and served to AI agents"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect>=1.13.0",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "fastapi>=0.165.0",
  "uvicorn[standard]>=0.54.0",
  "fastmcp>=4.2.6",
  "psycopg[binary]>=3.3.9",
  "alembic>=1.20.1",
  "pydantic>=2.14.4",
  "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
 "playwright>=1.65.2",
 "pytest>=9.2.0",
]

[project.scripts]
ohmydb = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
