# Optional: set OHMYDB_AUTH_TOKEN to require `Authorization: Bearer <token>`
# on mutating HTTP endpoints (POST /api/sync, PUT/DELETE /api/labels). Reads
# and MCP stay open regardless. Unset (the default) = no auth — fine for
# localhost-only dev; set it for anything reachable past that. Env-only, no
# yaml field, so a token never ends up in a mounted config file.

storage:
  # Local debug: sqlite, just a file url.
  type: sqlite
  url: sqlite:///ohmydb.sqlite
  # Prod: postgres. Comment out the two lines above, uncomment below.
  # type: postgres
  # host: localhost
  # port: 5432
  # username: ohmydb
  # password: "ohmydb"     # prod: prefer POSTGRES_PASSWORD env over this
  # database: ohmydb

# Optional: auto-derive labels from entity properties during sync (in
# addition to manual PUT /labels). Applied to every cluster before its own
# label_rules below (additive). Matchers: engine (exact), kind (exact),
# name_pattern/database_pattern (regex). All matching rules apply; if two
# rules set the same key, the last one wins. A manual label for a key always
# overrides an auto one for that identity.
# label_rules:
#   - match: {kind: dictionary}
#     label: {key: source, value: dictionary}

# Credential env precedence per cluster (highest wins):
#   CLICKHOUSE_USER__<KEY> / CLICKHOUSE_PASSWORD__<KEY>   (KEY = cluster name,
#     uppercased, non-alphanumerics -> "_", e.g. "prod-eu" -> "PROD_EU")
#   CLICKHOUSE_USER / CLICKHOUSE_PASSWORD                 (global fallback)
#   this file's username/password
clusters:
  - name: local
    type: clickhouse
    host: localhost
    port: 8123
    username: default
    password: "ohmydb"       # prod: prefer CLICKHOUSE_PASSWORD[__KEY] env over this
    databases: []            # empty = all non-system databases
    # extra: kwargs passed straight to the ClickHouse client. Examples:
    # extra:
    #   secure: true          # TLS
    #   verify: false         # skip cert verification
    #   connect_timeout: 30
    #   send_receive_timeout: 300
    # label_rules: []         # per-cluster, same shape as the global list above
