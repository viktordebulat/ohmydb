version: "3"

# Local dev runs against the committed template; prod mounts its own config
# and sets OHMYDB_CONFIG itself.
env:
  OHMYDB_CONFIG: config.example.yaml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: "Full local stack: seeded ClickHouse + sync + API (+ MCP at /mcp)"
    cmds:
      - uv sync
      # --wait only on clickhouse: it fails on the one-shot init container
      # even when it exits 0; seeding runs synchronously instead
      - docker compose up -d --wait clickhouse
      - docker compose run --rm clickhouse-init
      - uv run ohmydb sync
      - uv run ohmydb serve

  serve:
    desc: "Service only: API + MCP (at /mcp) against existing catalog (no ClickHouse)"
    cmds:
      - uv sync
      - uv run ohmydb serve

  sync:
    desc: "Introspect clusters into the catalog"
    cmds:
      - uv run ohmydb sync

  demo:build:
    desc: "Build the static GitHub Pages demo snapshot (docs/demo/) from a seeded local ClickHouse"
    cmds:
      - uv sync
      - docker compose up -d --wait clickhouse
      - docker compose run --rm clickhouse-init
      - uv run ohmydb sync
      - uv run python scripts/build_demo.py
      - docker compose --profile postgres down

  mcp:
    desc: "MCP server over stdio (for AI agents that spawn a local process)"
    cmds:
      - uv run ohmydb mcp

  test:
    desc: "Run tests (integration auto-skips without ClickHouse)"
    cmds:
      - uv run pytest

  docs:verify:
    desc: "Fail if ARCHITECTURE.md's module table has drifted from app/"
    cmds:
      - ./scripts/check-docs.sh

  db:revision:
    desc: "Autogenerate an Alembic migration from app/store/db.py model changes"
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  check:
    desc: "Full check: tests + architecture docs drift"
    cmds:
      - task: test
      - task: docs:verify

  down:
    desc: "Stop containers"
    cmds:
      - docker compose --profile postgres down

  clean:
    desc: "Stop containers, drop volumes and local catalog"
    cmds:
      - docker compose --profile postgres down -v
      - rm -f ohmydb.sqlite
